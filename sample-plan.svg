<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 230 1680 1060" width="1680" height="1060">
  <!-- Fictional posted evacuation plan for the public demo. Layout modelled on a real
       small restaurant plan; name and address are made up. Coordinates in source pixels. -->
  <rect x="80" y="230" width="1680" height="1060" fill="#fff"/>

  <!-- Title band and level label -->
  <rect x="580" y="258" width="1046" height="80" rx="22" fill="#2E9A47"/>
  <text x="1103" y="320" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#1B5E2A">PLAN D'EVACUATION</text>
  <rect x="952" y="430" width="172" height="28" rx="14" fill="#fff" stroke="#2E9A47" stroke-width="3"/>
  <text x="1038" y="451" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" font-weight="700" font-size="17" fill="#222">Rez de Chaussée</text>
  <text x="1512" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="38" fill="#222">RESTAURANT EXEMPLE</text>
  <text x="1512" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#333">1 rue de l'Exemple</text>
  <text x="1512" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#333">00000 Ville</text>

  <!-- "Incendie" box -->
  <rect x="125" y="305" width="365" height="210" rx="12" fill="#fff" stroke="#E53935" stroke-width="4"/>
  <path d="M137 305 h200 l-30 40 h-170 a12 12 0 0 1 -12 -12 v-16 a12 12 0 0 1 12 -12z" fill="#E53935"/>
  <text x="145" y="338" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#fff">Incendie</text>
  <rect x="150" y="365" width="55" height="55" fill="#E53935"/><rect x="168" y="375" width="18" height="34" fill="#fff"/>
  <rect x="232" y="400" width="164" height="30" fill="none" stroke="#E53935" stroke-width="2"/>
  <text x="270" y="424" font-family="Arial, sans-serif" font-size="26" fill="#E53935">18 ou 112</text>
  <rect x="150" y="440" width="55" height="55" fill="#E53935"/><circle cx="177" cy="458" r="8" fill="#fff"/><rect x="170" y="468" width="14" height="22" fill="#fff"/>
  <text x="232" y="463" font-family="Arial, sans-serif" font-size="13" fill="#222">Attaquez le foyer à la base au moyen</text>
  <text x="232" y="480" font-family="Arial, sans-serif" font-size="13" fill="#222">d'extincteurs sans prendre de risques.</text>

  <!-- "Evacuation" box -->
  <rect x="97" y="555" width="388" height="700" rx="14" fill="#fff" stroke="#2E9A47" stroke-width="4"/>
  <path d="M109 555 h300 l-40 45 h-260 a12 12 0 0 1 -12 -12 v-21 a12 12 0 0 1 12 -12z" fill="#2E9A47"/>
  <text x="133" y="592" font-family="Georgia, serif" font-weight="700" font-size="32" fill="#fff">Evacuation</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#222">
    <rect x="135" y="620" width="58" height="55" fill="#2E9A47"/><text x="207" y="642">A l'audition du signal sonore ou sur ordre</text><text x="207" y="658">d'un responsable.</text>
    <rect x="135" y="688" width="58" height="55" fill="#2E9A47"/><text x="205" y="708">Dirigez-vous vers les sorties les</text><text x="205" y="724">plus proches.</text>
    <rect x="135" y="755" width="58" height="55" fill="#2E9A47"/><text x="203" y="778">Suivez les indications du chargé</text><text x="203" y="794">d'évacuation.</text>
    <circle cx="160" cy="845" r="27" fill="#fff" stroke="#E53935" stroke-width="5"/><line x1="141" y1="826" x2="179" y2="864" stroke="#E53935" stroke-width="5"/><text x="200" y="844">Ne revenez jamais en arrière sans y</text><text x="200" y="860">avoir été invité.</text>
    <circle cx="157" cy="912" r="27" fill="#fff" stroke="#E53935" stroke-width="5"/><line x1="138" y1="893" x2="176" y2="931" stroke="#E53935" stroke-width="5"/><text x="198" y="908">N'utilisez jamais les ascenseurs ou</text><text x="198" y="924">monte-charges.</text>
    <rect x="125" y="952" width="58" height="55" fill="#2E9A47"/><text x="195" y="967">Si les escaliers sont envahis</text><text x="195" y="983">par la fumée, manifestez votre</text><text x="195" y="999">présence aux fenêtres.</text>
    <rect x="125" y="1020" width="58" height="62" fill="#2E9A47"/><text x="198" y="1029">Si vous ne pouvez pas évacuer par vous</text><text x="198" y="1045">même, dirigez vous vers l'espace d'attente</text><text x="198" y="1061">sécurisé le plus proche et ne le quittez</text><text x="198" y="1077">plus.</text>
    <rect x="122" y="1090" width="58" height="50" fill="#E53935"/><text x="197" y="1100">Conservez libres les dégagements</text><text x="197" y="1116">(couloirs, sorties...)</text><text x="197" y="1132">N'encombrez pas les moyens de secours.</text>
    <text x="205" y="1166" font-size="17" font-weight="700" fill="#2E9A47">Point de rassemblement :</text>
    <rect x="120" y="1175" width="58" height="55" fill="#2E9A47"/><rect x="197" y="1175" width="258" height="52" fill="none" stroke="#ccc" stroke-width="1.5"/>
  </g>

  <!-- Walls: thin black lines like the posted plan -->
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="square">
    <path d="M630 715 V517 H1565 V770"/>
    <path d="M1569 875 V1140 H622 V800"/>
    <path d="M855 520 V718"/>
    <path d="M630 630 H752 M820 630 H855"/>
  </g>
  <!-- Thin partitions, bar and counters -->
  <g fill="none" stroke="#333" stroke-width="2.5">
    <rect x="630" y="630" width="93" height="73"/>
    <rect x="1135" y="525" width="33" height="243"/>
    <rect x="1135" y="888" width="33" height="252"/>
    <rect x="1525" y="525" width="40" height="70"/>
    <rect x="1527" y="665" width="38" height="105"/>
    <rect x="1531" y="880" width="38" height="110"/>
    <rect x="1531" y="1060" width="38" height="80"/>
    <rect x="630" y="815" width="43" height="325"/>
  </g>

  <!-- Room names and outside labels -->
  <g font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#000" text-anchor="middle">
    <text x="745" y="580" font-size="16">WC</text>
    <text x="995" y="649">Salle</text>
    <text x="1337" y="669">Cuisine</text>
    <text x="905" y="1021">Salle</text>
    <text x="1370" y="1021">Salle</text>
    <text x="560" y="695">Accès Petite</text><text x="560" y="715">Terrasse</text>
    <text x="1622" y="746" font-size="15">Entrée</text><text x="1622" y="765" font-size="15">Principale</text>
    <text transform="translate(1636 1010) rotate(-90)" font-size="15">Rue de l'Exemple</text>
  </g>

  <!-- Safety pictograms (coloured: removed by the cleanup) -->
  <rect x="592" y="745" width="30" height="30" fill="#2E9A47"/><rect x="600" y="751" width="10" height="18" fill="#fff"/>
  <rect x="1577" y="808" width="30" height="30" fill="#2E9A47"/><rect x="1585" y="814" width="10" height="18" fill="#fff"/>
  <path d="M708 768 l16 -12 v7 h16 v10 h-16 v7z" fill="#2E9A47"/>
  <path d="M1442 823 l-16 -12 v7 h-16 v10 h16 v7z" fill="#2E9A47"/>
  <rect x="1171" y="682" width="28" height="26" fill="#F2D33B" stroke="#333" stroke-width="1.5"/><text x="1185" y="701" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#333">BT</text>
  <rect x="1172" y="737" width="26" height="28" fill="#E53935"/><rect x="1181" y="742" width="8" height="18" fill="#fff"/>
  <rect x="1534" y="636" width="26" height="28" fill="#E53935"/><rect x="1543" y="641" width="8" height="18" fill="#fff"/>
  <rect x="1138" y="1042" width="42" height="22" fill="#F2D33B" stroke="#333" stroke-width="1.5"/>
  <line x1="1462" y1="757" x2="1540" y2="775" stroke="#1E5BD8" stroke-width="2.5"/><circle cx="1540" cy="775" r="5" fill="#1E5BD8"/>
  <circle cx="1427" cy="743" r="37" fill="#1E5BD8"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle"><text x="1427" y="731">Vous</text><text x="1427" y="747">êtes</text><text x="1427" y="763">ici</text></g>
</svg>
