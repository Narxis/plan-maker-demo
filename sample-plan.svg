<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#2e9b45"/>
    </marker>
    <g id="exit">
      <rect width="56" height="56" fill="#1f9d4a"/>
      <circle cx="30" cy="14" r="5" fill="#fff"/>
      <path d="M30 20 L22 32 L14 34 M30 20 L38 28 L46 26 M24 31 L30 44 L24 50 M30 34 L38 44 L38 50" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="ext">
      <rect width="40" height="40" fill="#d32a2a"/>
      <rect x="14" y="8" width="12" height="24" fill="#fff"/>
    </g>
  </defs>
  <rect width="1600" height="1100" fill="#fff"/>

  <!-- Title band and header -->
  <rect x="0" y="0" width="1600" height="110" fill="#2e9b45"/>
  <text x="60" y="72" font-size="52" font-weight="bold" fill="#fff">PLAN D'ÉVACUATION</text>
  <text x="60" y="150" font-size="26" fill="#000">Restaurant Exemple · 1 rue de l'Exemple · 00000 Ville</text>
  <text x="380" y="200" font-size="30" font-weight="bold" fill="#000">Niveau 0</text>

  <!-- Escape corridor fill -->
  <rect x="384" y="484" width="1112" height="92" fill="#cfe8b0"/>

  <!-- Outer walls (with a door gap at the right for the main exit) -->
  <g stroke="#000" stroke-width="10" stroke-linecap="square" fill="none">
    <path d="M380 220 H1500 V500"/>
    <path d="M1500 570 V900 H380 V220"/>
  </g>
  <!-- Inner walls -->
  <g stroke="#000" stroke-width="5" stroke-linecap="square" fill="none">
    <path d="M640 220 V380"/>
    <path d="M640 430 V480"/>
    <path d="M1000 220 V300"/>
    <path d="M1000 350 V480"/>
    <path d="M1250 220 V400"/>
    <path d="M1250 450 V480"/>
    <path d="M380 480 H500"/>
    <path d="M550 480 H1500"/>
    <path d="M380 580 H560"/>
    <path d="M610 580 H1500"/>
    <path d="M640 580 V640"/>
    <path d="M640 700 V900"/>
  </g>

  <!-- Room names -->
  <g font-size="26" font-weight="bold" fill="#000" text-anchor="middle">
    <text x="510" y="360">RÉSERVE</text>
    <text x="820" y="360">CUISINE</text>
    <text x="1125" y="360">PLONGE</text>
    <text x="1375" y="360">WC</text>
    <text x="510" y="750">BUREAU</text>
    <text x="1070" y="750">SALLE</text>
  </g>

  <!-- Furniture in the dining room -->
  <g stroke="#000" stroke-width="3" fill="none">
    <rect x="740" y="800" width="70" height="50"/>
    <rect x="900" y="800" width="70" height="50"/>
    <rect x="1060" y="800" width="70" height="50"/>
    <rect x="1220" y="800" width="70" height="50"/>
    <rect x="1380" y="800" width="70" height="50"/>
    <rect x="760" y="620" width="70" height="50"/>
    <rect x="940" y="620" width="70" height="50"/>
    <rect x="1120" y="620" width="70" height="50"/>
  </g>

  <!-- Escape route arrows -->
  <g stroke="#2e9b45" stroke-width="8" fill="none" marker-end="url(#ah)">
    <path d="M430 530 H1380"/>
    <path d="M1000 640 V590" stroke-width="6"/>
    <path d="M1440 530 H1490"/>
  </g>

  <!-- Exit pictograms and extinguishers -->
  <use href="#exit" x="1530" y="502"/>
  <use href="#ext" x="1180" y="492"/>
  <use href="#ext" x="660" y="840"/>
  <use href="#ext" x="880" y="240"/>

  <!-- You are here -->
  <circle cx="1100" cy="530" r="18" fill="#1d5fd1"/>
  <path d="M1100 530 V620" stroke="#1d5fd1" stroke-width="5"/>
  <text x="1070" y="610" font-size="22" fill="#1d5fd1" text-anchor="end" font-weight="bold">Vous êtes ici</text>

  <!-- Consignes box -->
  <rect x="40" y="260" width="300" height="420" fill="#fff" stroke="#d32a2a" stroke-width="6"/>
  <text x="60" y="305" font-size="26" font-weight="bold" fill="#000">Consignes</text>
  <g font-size="20" fill="#000">
    <text x="60" y="350">Gardez votre calme.</text>
    <text x="60" y="385">Alertez les secours : 18.</text>
    <text x="60" y="420">Évacuez par la sortie</text>
    <text x="60" y="445">la plus proche.</text>
    <text x="60" y="490">N'utilisez pas l'ascenseur.</text>
    <text x="60" y="525">Ne revenez pas en arrière.</text>
    <text x="60" y="570">Rejoignez le point de</text>
    <text x="60" y="595">rassemblement.</text>
    <text x="60" y="640">Fermez les portes.</text>
  </g>

  <!-- Legend -->
  <rect x="1040" y="940" width="520" height="130" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="1060" y="975" font-size="22" font-weight="bold" fill="#000">Légende</text>
  <use href="#exit" x="1060" y="990" transform="translate(1060 990) scale(0.7) translate(-1060 -990)" />
  <text x="1115" y="1020" font-size="20" fill="#000">Sortie</text>
  <use href="#ext" x="1220" y="990" transform="translate(1220 990) scale(0.9) translate(-1220 -990)"/>
  <text x="1265" y="1020" font-size="20" fill="#000">Extincteur</text>
  <circle cx="1400" cy="1008" r="12" fill="#1d5fd1"/>
  <text x="1422" y="1015" font-size="20" fill="#000">Vous êtes ici</text>
  <rect x="1060" y="1040" width="40" height="18" fill="#cfe8b0"/>
  <text x="1115" y="1056" font-size="20" fill="#000">Chemin d'évacuation</text>
</svg>
